zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: b5928525239f4efd931648e24064919c
      template: 'Cisco IE1000 by SNMP'
      name: 'Cisco IE1000 by SNMP'
      description: |
        Template for monitoring Cisco Industrial Ethernet 1000 Series switches via SNMP.

        This template uses Cisco IE1000 private MIB objects under CISCO-IE1000-MIB / CIE1000-SYSUTIL-MIB.
        Interface monitoring uses the same IF-MIB discovery method as Network Generic Device by SNMP.
        The discovery uses IF-MIB ifTable and ifXTable objects. Interface traffic and speed items use IF-MIB ifTable objects.

        Temperature monitor OIDs:
        - Board temperature:    .1.3.6.1.4.1.9.9.832.1.24.1.3.6.1.5.0
        - Junction temperature: .1.3.6.1.4.1.9.9.832.1.24.1.3.6.1.5.1

        Threshold OIDs:
        - Board low:            .1.3.6.1.4.1.9.9.832.1.24.1.2.3.1.2.0
        - Board high:           .1.3.6.1.4.1.9.9.832.1.24.1.2.3.1.3.0
        - Board critical:       .1.3.6.1.4.1.9.9.832.1.24.1.2.3.1.4.0
        - Junction low:         .1.3.6.1.4.1.9.9.832.1.24.1.2.3.1.2.1
        - Junction high:        .1.3.6.1.4.1.9.9.832.1.24.1.2.3.1.3.1
        - Junction critical:    .1.3.6.1.4.1.9.9.832.1.24.1.2.3.1.4.1

        Alarm OIDs:
        - Board low alarm:      .1.3.6.1.4.1.9.9.832.1.24.1.3.6.1.2.0
        - Board high alarm:     .1.3.6.1.4.1.9.9.832.1.24.1.3.6.1.3.0
        - Board critical alarm: .1.3.6.1.4.1.9.9.832.1.24.1.3.6.1.4.0
        - Junction low alarm:   .1.3.6.1.4.1.9.9.832.1.24.1.3.6.1.2.1
        - Junction high alarm:  .1.3.6.1.4.1.9.9.832.1.24.1.3.6.1.3.1
        - Junction critical alarm: .1.3.6.1.4.1.9.9.832.1.24.1.3.6.1.4.1

        Alarm values use SNMP TruthValue:
        - 1 = true
        - 2 = false

        Additional IE1000-specific OIDs:
        - CPU load 10 sec:      .1.3.6.1.4.1.9.9.832.1.24.1.3.1.3.0
        - Interface discovery:  IF-MIB ifOperStatus, ifAdminStatus, ifAlias, ifName, ifDescr, ifType
        - Interface status:     .1.3.6.1.2.1.2.2.1.8.<ifIndex>
        - Interface type:       .1.3.6.1.2.1.2.2.1.3.<ifIndex>
        - Interface in octets:  .1.3.6.1.2.1.2.2.1.10.<ifIndex>
        - Interface out octets: .1.3.6.1.2.1.2.2.1.16.<ifIndex>
        - Interface in errors:  .1.3.6.1.2.1.2.2.1.14.<ifIndex>
        - Interface out errors: .1.3.6.1.2.1.2.2.1.20.<ifIndex>
        - Interface in discards:.1.3.6.1.2.1.2.2.1.13.<ifIndex>
        - Interface out discards:.1.3.6.1.2.1.2.2.1.19.<ifIndex>
        - Interface speed:      .1.3.6.1.2.1.2.2.1.5.<ifIndex>
        - PoE switch budget:    .1.3.6.1.4.1.9.9.832.1.43.1.2.2.1.1.2.1
        - PoE port state:       .1.3.6.1.4.1.9.9.832.1.43.1.3.1.1.3.<ifIndex>
        - PoE port consumption: .1.3.6.1.4.1.9.9.832.1.43.1.3.1.1.4.<ifIndex>
        - PoE port reserved:    .1.3.6.1.4.1.9.9.832.1.43.1.3.1.1.5.<ifIndex>
        - PoE port current:     .1.3.6.1.4.1.9.9.832.1.43.1.3.1.1.6.<ifIndex>
        - PoE port max power:   .1.3.6.1.4.1.9.9.832.1.43.1.2.3.1.1.4.<ifIndex>
        - PoE port PD class:    .1.3.6.1.4.1.9.9.832.1.43.1.3.1.1.2.<ifIndex>
        - Main power state:     .1.3.6.1.4.1.9.9.832.1.24.1.3.2.1.3.1.1
        - Redundant power state:.1.3.6.1.4.1.9.9.832.1.24.1.3.2.1.3.1.2
        - System LED status:    .1.3.6.1.4.1.9.9.832.1.24.1.3.3.1.2.1
        - Alarm status text:    .1.3.6.1.4.1.9.9.832.1.24.1.3.7.1.1.4.0
        - DC-A status text:     .1.3.6.1.4.1.9.9.832.1.24.1.3.7.1.1.4.1
        - DC-B status text:     .1.3.6.1.4.1.9.9.832.1.24.1.3.7.1.1.4.2
        - Express setup status: .1.3.6.1.4.1.9.9.832.1.24.1.3.7.1.1.4.3
        - PoE status text:      .1.3.6.1.4.1.9.9.832.1.24.1.3.7.1.1.4.4
        - SYS status text:      .1.3.6.1.4.1.9.9.832.1.24.1.3.7.1.1.4.5
        - Board serial number:  .1.3.6.1.4.1.9.9.832.1.24.1.3.5.3.0
        - Board type:           .1.3.6.1.4.1.9.9.832.1.24.1.3.5.4.0
        - CIP serial number:    .1.3.6.1.4.1.9.9.832.1.24.1.3.5.5.0

        Power supply state values:
        - 0 = active
        - 1 = standby
        - 2 = notPresent

        PoE ports are discovered from CIE1000-POE-MIB:
        - PoE capable table: .1.3.6.1.4.1.9.9.832.1.43.1.1.1.1.2.<ifIndex>

        PoE power values for port consumption, reserved power, and port max power are exposed in deciwatt and converted to Watt by preprocessing.

        Verified on Cisco IE-1000-4P2S-LM running IE1000 Version saturn-3.05.03 / software 1.8.2.
        Standard ENTITY-SENSOR-MIB and CISCO-ENTITY-SENSOR-MIB were not available on the tested device.

        Author: hshimomura

        Template source: https://github.com/zabbix-community/community-templates/tree/main/Network_Devices/Cisco/template_cisco_ie1000_by_snmp

        Template version: 1.0.0
      groups:
        - name: 'Templates/Network devices'
      tags:
        - tag: class
          value: network
        - tag: target
          value: cisco
        - tag: target
          value: cisco-ie1000
      items:
        - uuid: 31aa3dd48b11461092aff9a79fae8482
          name: 'Board serial number'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.9.9.832.1.24.1.3.5.3.0
          key: cisco.ie1000.board.serial
          delay: 1h
          value_type: TEXT
          trends: '0'
          description: 'Board serial number reported by CIE1000-SYSUTIL-MIB.'
          tags:
            - tag: component
              value: inventory
        - uuid: 8584ce4211dd4614b72d1393c6ce4041
          name: 'Board type'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.9.9.832.1.24.1.3.5.4.0
          key: cisco.ie1000.board.type
          delay: 1h
          value_type: TEXT
          trends: '0'
          description: 'Board type reported by CIE1000-SYSUTIL-MIB.'
          tags:
            - tag: component
              value: inventory
        - uuid: d189ea906b7c466ca638e0106293be16
          name: 'CIP serial number'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.9.9.832.1.24.1.3.5.5.0
          key: cisco.ie1000.cip.serial
