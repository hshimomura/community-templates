          description: 'Alarm status text reported by CIE1000-SYSUTIL-MIB.'
          tags:
            - tag: component
              value: status
        - uuid: 8b2544bcdcc74a5897268b52efa45479
          name: 'Express setup status description'
          type: SNMP_AGENT
