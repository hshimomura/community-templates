        - uuid: 71857b93324d4cba8bf56cbae4871d8e
          name: 'DC-B status description'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.9.9.832.1.24.1.3.7.1.1.4.2
