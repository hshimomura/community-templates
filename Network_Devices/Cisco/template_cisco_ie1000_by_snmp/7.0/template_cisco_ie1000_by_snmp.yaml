      discovery_rules:
        - uuid: 659016174768457085df375535ce549f
          name: 'Network interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3]'
          key: cisco.ie1000.interface.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.MATCHES}'
                formulaid: A
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
              - macro: '{#IFALIAS}'
                value: '{$NET.IF.IFALIAS.MATCHES}'
                formulaid: C
              - macro: '{#IFALIAS}'
                value: '{$NET.IF.IFALIAS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: D
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.MATCHES}'
                formulaid: E
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: F
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.MATCHES}'
                formulaid: G
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: H
              - macro: '{#IFOPERSTATUS}'
                value: '{$NET.IF.IFOPERSTATUS.MATCHES}'
                formulaid: I
              - macro: '{#IFOPERSTATUS}'
                value: '{$NET.IF.IFOPERSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: J
              - macro: '{#IFTYPE}'
                value: '{$NET.IF.IFTYPE.MATCHES}'
                formulaid: K
              - macro: '{#IFTYPE}'
                value: '{$NET.IF.IFTYPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: L
          description: 'Discovers network interfaces using the same IF-MIB discovery method as Network Generic Device by SNMP. Keys are namespaced to avoid collisions.'
          item_prototypes:
            - uuid: a10266bfcb024bd5839cd229fb69e0fb
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]'
              key: 'cisco.ie1000.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
              delay: 3m
              description: 'Inbound packet discard rate on interface {#IFNAME}({#IFALIAS}).'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 6b2cffbb4ca34acf88c0145a9fb26aa2
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets with errors'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]'
              key: 'cisco.ie1000.if.in.errors[ifInErrors.{#SNMPINDEX}]'
              delay: 3m
              description: 'Inbound packet error rate on interface {#IFNAME}({#IFALIAS}).'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: f58556958bf64a14a5987aa978849eaf
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits received'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}]'
              key: 'cisco.ie1000.if.in[ifInOctets.{#SNMPINDEX}]'
              delay: 3m
              units: bps
              description: 'Inbound traffic rate on interface {#IFNAME}({#IFALIAS}), calculated from ifInOctets.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 663320d456e840a7b036523ea9dfd1f1
              name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]'
              key: 'cisco.ie1000.if.out.discards[ifOutDiscards.{#SNMPINDEX}]'
              delay: 3m
              description: 'Outbound packet discard rate on interface {#IFNAME}({#IFALIAS}).'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 4b0debb3a96744249c1cdac8f3e322f2
              name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets with errors'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]'
              key: 'cisco.ie1000.if.out.errors[ifOutErrors.{#SNMPINDEX}]'
              delay: 3m
              description: 'Outbound packet error rate on interface {#IFNAME}({#IFALIAS}).'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 8d653ad69bab4db29a52d3c485c11636
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits sent'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}]'
              key: 'cisco.ie1000.if.out[ifOutOctets.{#SNMPINDEX}]'
              delay: 3m
              units: bps
              description: 'Outbound traffic rate on interface {#IFNAME}({#IFALIAS}), calculated from ifOutOctets.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 479d46ba831b45459fe1b51282319fe0
              name: 'Interface {#IFNAME}({#IFALIAS}): Speed'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.5.{#SNMPINDEX}]'
              key: 'cisco.ie1000.if.speed[ifSpeed.{#SNMPINDEX}]'
              delay: 5m
              trends: '0'
              units: bps
              description: 'Interface speed from ifSpeed for {#IFNAME}({#IFALIAS}).'
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: a5d3b2e0bad144e682a66c89d88e8212
              name: 'Interface {#IFNAME}({#IFALIAS}): Operational status'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]'
              key: 'cisco.ie1000.if.status[ifOperStatus.{#SNMPINDEX}]'
              trends: '0'
              description: 'Operational status of interface {#IFNAME}({#IFALIAS}).'
              valuemap:
                name: 'IF-MIB interface status'
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: 5b96c6d82f5848b7bf63712f0ef821df
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Cisco IE1000 by SNMP/cisco.ie1000.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/Cisco IE1000 by SNMP/cisco.ie1000.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Cisco IE1000 by SNMP/cisco.ie1000.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Cisco IE1000 by SNMP/cisco.ie1000.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
                  name: 'IE1000 by SNMP: Interface {#IFNAME}({#IFALIAS}): Link down'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'The interface operational status changed to down. This follows the same link-down trigger logic as Network Generic Device by SNMP.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 84f864264cfb41eaa16c27dbde1aa7b9
              name: 'Interface {#IFNAME}({#IFALIAS}): Interface type'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.3.{#SNMPINDEX}]'
              key: 'cisco.ie1000.if.type[ifType.{#SNMPINDEX}]'
              delay: 1h
              trends: '0'
              description: 'Interface type for {#IFNAME}({#IFALIAS}).'
              valuemap:
                name: 'IF-MIB::ifType'
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
        - uuid: 298f67b447484ca881af68d632232e2e
          name: 'PoE port discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#POE_CAPABLE},1.3.6.1.4.1.9.9.832.1.43.1.1.1.1.2]'
          key: cisco.ie1000.poe.discovery
          delay: 1h
          filter:
            conditions:
              - macro: '{#POE_CAPABLE}'
                value: '1'
                formulaid: A
          description: 'Discovers PoE-capable interfaces from CIE1000-POE-MIB and creates per-port PoE monitoring items.'
          item_prototypes:
            - uuid: f80e589ec8cc4dd1a500743d01721b15
              name: 'PoE port {#SNMPINDEX} current consumption'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.9.9.832.1.43.1.3.1.1.6.{#SNMPINDEX}'
              key: 'cisco.ie1000.poe.current[{#SNMPINDEX}]'
              delay: 5m
              units: mA
              description: 'Current drawn by the powered device on discovered PoE port {#SNMPINDEX}.'
              tags:
                - tag: component
                  value: poe
            - uuid: 821973c1026247c2b7cae200a67cb929
              name: 'PoE port {#SNMPINDEX} PD class'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.9.9.832.1.43.1.3.1.1.2.{#SNMPINDEX}'
              key: 'cisco.ie1000.poe.pd_class[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              description: 'Powered device class detected on discovered PoE port {#SNMPINDEX}. Value -1 means no usable PD class or no PD detected.'
              tags:
                - tag: component
                  value: poe
            - uuid: 9f9cefc76bc2479e8901b9bd70864244
              name: 'PoE port {#SNMPINDEX} power consumption'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.9.9.832.1.43.1.3.1.1.4.{#SNMPINDEX}'
              key: 'cisco.ie1000.poe.power.consumption[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: W
              description: 'Current PoE power consumed by discovered port {#SNMPINDEX}. The device reports deciwatt; preprocessing converts it to Watt.'
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.1'
              tags:
                - tag: component
                  value: poe
            - uuid: f50b70947a0d4d34a9e1025a2185d735
              name: 'PoE port {#SNMPINDEX} max power'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.9.9.832.1.43.1.2.3.1.1.4.{#SNMPINDEX}'
              key: 'cisco.ie1000.poe.power.max[{#SNMPINDEX}]'
              delay: 1h
              value_type: FLOAT
              units: W
              description: 'Configured maximum PoE power for discovered port {#SNMPINDEX}. The device reports deciwatt; preprocessing converts it to Watt.'
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.1'
              tags:
                - tag: component
                  value: poe
            - uuid: 38c58f3c3abf4e96a308889d015564a6
              name: 'PoE port {#SNMPINDEX} reserved power'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.9.9.832.1.43.1.3.1.1.5.{#SNMPINDEX}'
              key: 'cisco.ie1000.poe.power.reserved[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: W
              description: 'PoE power reserved by discovered port {#SNMPINDEX}. The device reports deciwatt; preprocessing converts it to Watt.'
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.1'
              tags:
                - tag: component
                  value: poe
            - uuid: d1da817b53794bf9af91393fb44e0d50
              name: 'PoE port {#SNMPINDEX} state'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.9.9.832.1.43.1.3.1.1.3.{#SNMPINDEX}'
              key: 'cisco.ie1000.poe.state[{#SNMPINDEX}]'
              delay: 5m
              description: 'PoE status for discovered port {#SNMPINDEX}. Values are defined by CIE1000-POE-MIB cie1000PoeStatusInterfaceCurrentState.'
              valuemap:
                name: 'Cisco IE1000 PoE port state'
              tags:
                - tag: component
                  value: poe
              trigger_prototypes:
                - uuid: 8a165319bf2c4ee98dff3f5975646888
                  expression: 'last(/Cisco IE1000 by SNMP/cisco.ie1000.poe.state[{#SNMPINDEX}])=1 or last(/Cisco IE1000 by SNMP/cisco.ie1000.poe.state[{#SNMPINDEX}])=4'
                  name: 'PoE port {#SNMPINDEX} has a power fault'
                  priority: HIGH
                  description: 'The IE1000 reports a PoE power budget exceeded or overload state on discovered port {#SNMPINDEX}.'
                  tags:
                    - tag: scope
                      value: availability
      macros:
        - macro: '{$IFCONTROL}'
          value: '1'
        - macro: '{$NET.IF.IFADMINSTATUS.MATCHES}'
          value: '^.*'
        - macro: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
          value: ^2$
          description: 'Ignore down(2) administrative status'
        - macro: '{$NET.IF.IFALIAS.MATCHES}'
          value: '.*'
        - macro: '{$NET.IF.IFALIAS.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
        - macro: '{$NET.IF.IFDESCR.MATCHES}'
          value: '.*'
        - macro: '{$NET.IF.IFDESCR.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
        - macro: '{$NET.IF.IFNAME.MATCHES}'
          value: '^.*$'
        - macro: '{$NET.IF.IFNAME.NOT_MATCHES}'
          value: '(^Software Loopback Interface|^NULL[0-9.]*$|^[Ll]o[0-9.]*$|^[Ss]ystem$|^Nu[0-9.]*$|^veth[0-9a-z]+$|docker[0-9]+|br-[a-z0-9]{12})'
          description: 'Filter out loopbacks, nulls, docker veth links and docker0 bridge by default'
        - macro: '{$NET.IF.IFOPERSTATUS.MATCHES}'
          value: '^.*$'
        - macro: '{$NET.IF.IFOPERSTATUS.NOT_MATCHES}'
          value: ^6$
          description: 'Ignore notPresent(6)'
        - macro: '{$NET.IF.IFTYPE.MATCHES}'
          value: '.*'
        - macro: '{$NET.IF.IFTYPE.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
      valuemaps:
        - uuid: 1e116446eeaf4595ba1330f1884702d4
          name: 'Cisco IE1000 PoE port state'
          mappings:
            - value: '1'
              newvalue: powerBudgetExceeded
            - value: '2'
              newvalue: noPdDetected
            - value: '3'
              newvalue: pdOn
            - value: '4'
              newvalue: pdOverload
        - uuid: c5a6bf1f99444db397b4edb8c8dbf850
          name: 'Cisco IE1000 power supply state'
          mappings:
            - value: '0'
              newvalue: active
            - value: '1'
              newvalue: standby
            - value: '2'
              newvalue: notPresent
        - uuid: 8a2b6b0700b94a298d0924e535bd590e
          name: 'Cisco IE1000 truth value'
          mappings:
            - value: '1'
              newvalue: 'true'
            - value: '2'
              newvalue: 'false'
        - uuid: 13dea243bd5847958daa044b0c0fe6e3
          name: 'IF-MIB::ifType'
          mappings:
            - value: '1'
              newvalue: other
            - value: '6'
              newvalue: ethernetCsmacd
            - value: '7'
              newvalue: iso88023Csmacd
            - value: '24'
              newvalue: softwareLoopback
            - value: '53'
              newvalue: propVirtual
            - value: '62'
              newvalue: fastEther
            - value: '69'
              newvalue: fastEtherFX
            - value: '117'
              newvalue: gigabitEthernet
        - uuid: 30dd4a36819549d493a5a2a3191ee87a
          name: 'IF-MIB interface status'
          mappings:
            - value: '1'
              newvalue: up
            - value: '2'
              newvalue: down
            - value: '3'
              newvalue: testing
            - value: '4'
              newvalue: unknown
            - value: '5'
              newvalue: dormant
            - value: '6'
              newvalue: notPresent
            - value: '7'
              newvalue: lowerLayerDown
