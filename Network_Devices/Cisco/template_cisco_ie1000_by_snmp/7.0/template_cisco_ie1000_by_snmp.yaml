          value_type: TEXT
          trends: '0'
          description: 'CIP serial number reported by CIE1000-SYSUTIL-MIB.'
          tags:
            - tag: component
              value: inventory
        - uuid: 3140cd98199447e1808a98d882e31616
          name: 'CPU load average 10 sec'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.9.9.832.1.24.1.3.1.3.0
          key: 'cisco.ie1000.cpu.load[10s]'
          units: '%'
          description: 'CPU load average over 10 seconds from CIE1000-SYSUTIL-MIB. This is the longest CPU average exposed in the observed IE1000 SNMP tree, so it is polled every 1 minute.'
          tags:
            - tag: component
              value: cpu
        - uuid: 2ed1521c09b54a3ebb57cc3132c9b399
          name: 'PoE switch power budget'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.9.9.832.1.43.1.2.2.1.1.2.1
          key: cisco.ie1000.poe.power.budget
          delay: 1h
          units: W
          description: 'Maximum PoE power budget for the switch from CIE1000-POE-MIB.'
          tags:
            - tag: component
              value: poe
        - uuid: d3f8b8cc46474218aef3a07d9b0218d1
          name: 'Main power supply state'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.9.9.832.1.24.1.3.2.1.3.1.1
          key: 'cisco.ie1000.power.state[main]'
          delay: 5m
          description: 'Main power supply state. Values: 0=active, 1=standby, 2=notPresent.'
          valuemap:
            name: 'Cisco IE1000 power supply state'
          tags:
            - tag: component
              value: power
          triggers:
            - uuid: 24edf337e0ff4cac80cb103c641285ad
              expression: 'last(/Cisco IE1000 by SNMP/cisco.ie1000.power.state[main])<>0'
              name: 'Main power supply is not active'
              priority: HIGH
              description: 'The IE1000 reports that the main power supply is not in active state.'
              tags:
                - tag: scope
                  value: availability
        - uuid: ae227e7669be41b89e7b6cf9ce23d1ac
          name: 'Redundant power supply state'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.9.9.832.1.24.1.3.2.1.3.1.2
          key: 'cisco.ie1000.power.state[redundant]'
          delay: 5m
          description: 'Redundant power supply state. Values: 0=active, 1=standby, 2=notPresent. No default trigger is included because notPresent can be normal on single-power models.'
          valuemap:
            name: 'Cisco IE1000 power supply state'
          tags:
            - tag: component
              value: power
        - uuid: 6d57068f7dc64edebb18c30c7a3b5f77
          name: 'Alarm status description'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.9.9.832.1.24.1.3.7.1.1.4.0
          key: cisco.ie1000.status.alarm
