            - tag: component
              value: status
        - uuid: 07116cd3fab2455cbae7bd2add6a3c60
          name: 'Board temperature critical alarm'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.9.9.832.1.24.1.3.6.1.4.0
          key: 'cisco.ie1000.temperature.alarm.critical[board]'
          delay: 5m
          description: 'Board critical temperature alarm state. TruthValue: 1=true, 2=false.'
