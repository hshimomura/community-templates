            - tag: component
              value: power
        - uuid: f98f5e3e510940078d5052765a2cbb8d
          name: 'DC-A status description'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.9.9.832.1.24.1.3.7.1.1.4.1
