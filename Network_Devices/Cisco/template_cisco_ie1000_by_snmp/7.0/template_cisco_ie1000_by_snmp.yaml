            name: 'Cisco IE1000 truth value'
          tags:
            - tag: component
              value: temperature
          triggers:
            - uuid: f2ce1c60e376414cb4d64b753a752baa
              expression: 'last(/Cisco IE1000 by SNMP/cisco.ie1000.temperature.alarm.critical[board])=1'
              name: 'Board temperature critical alarm'
              priority: HIGH
              description: 'The device reports that the board temperature has reached the configured critical threshold.'
